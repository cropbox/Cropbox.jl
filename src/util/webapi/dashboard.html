<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cropbox Dashboard</title>
  <style>
    :root { color-scheme: light; --line:#d8dee8; --ink:#1d2630; --muted:#5d6875; --fill:#f5f7fa; --panel:#fff; --accent:#256f6c; --danger:#b24646; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--fill); }
    header { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin: 0; }
    main { display: grid; grid-template-columns: 390px minmax(0, 1fr); height: calc(100vh - 56px); }
    aside { min-width: 0; background: var(--panel); border-right: 1px solid var(--line); padding: 14px; overflow: auto; }
    section { min-width: 0; padding: 14px; overflow: auto; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; background: #fff; color: var(--ink); font: inherit; }
    input:focus, select:focus, textarea:focus { border-color: #8bb6b2; outline: none; box-shadow: 0 0 0 2px rgba(37,111,108,.1); }
    input[type="checkbox"] { width: auto; }
    input[type="range"] { padding: 0; }
    textarea { min-height: 110px; resize: vertical; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    button { height: 34px; border: 1px solid var(--accent); border-radius: 6px; padding: 0 11px; background: var(--accent); color: #fff; font-weight: 650; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .icon-button { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: #fff; color: var(--accent); border-color: var(--line); }
    .icon-button:hover:not(:disabled) { background: #eaf5f3; border-color: #83b7b2; }
    .icon-button.danger { color: #985252; }
    .icon-button.danger:hover:not(:disabled) { color: var(--danger); background: #fff5f5; border-color: #d9a8a8; }
    .icon-button.run { width: 38px; height: 34px; background: var(--accent); color: #fff; border-color: var(--accent); }
    .icon-button.run:hover:not(:disabled) { background: #1f5f5c; border-color: #1f5f5c; }
    .icon-button.run svg { fill: currentColor; }
    .icon-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .heading { display: flex; align-items: center; gap: 6px; min-height: 28px; margin: 0 0 12px; }
    .heading.spaced { margin-top: 20px; }
    .run-tools { display: flex; align-items: center; gap: 8px; }
    .status { color: var(--muted); font-size: 12px; }
    .status:empty { display: none; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #d5dde4; border-top-color: var(--accent); border-radius: 50%; animation: spin .75s linear infinite; }
    .run .spinner { border-color: rgba(255,255,255,.4); border-top-color: #fff; width: 16px; height: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #26384a; }
    .error { color: #9f3a38; white-space: pre-wrap; }
    .group { border: 1px solid var(--line); border-radius: 7px; background: #fff; margin-bottom: 10px; }
    .group summary { cursor: pointer; padding: 7px 8px; font-weight: 650; }
    .group[open] summary { border-bottom: 1px solid var(--line); }
    .group-body { padding: 8px; }
    .tree-section { margin: 12px 2px 6px; color: var(--muted); font-size: 10px; font-weight: 750; text-transform: uppercase; }
    .tree-section:first-child { margin-top: 2px; }
    .tree-row { border: 1px solid #e7edf3; border-radius: 6px; padding: 5px 6px; margin-bottom: 5px; background: #fff; }
    .tree-row.inactive { background: #fafbfc; }
    .tree-row.inactive .tree-name, .tree-row.inactive .tree-unit { opacity: .6; }
    .tree-row.active { border-color: #9bc5c0; background: #f7fbfa; }
    .tree-head { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 6px; align-items: center; }
    .tree-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    .tree-default { color: #8995a3; font-size: 11px; font-weight: 500; margin-left: 6px; }
    .tree-unit { color: #8995a3; font-size: 11px; max-width: 120px; text-align: right; overflow-wrap: anywhere; }
    .state-icon { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 5px; border: 1px solid #d9e2ec; color: #526170; background: #f7fafc; font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; cursor: help; }
    .editor { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-top: 7px; }
    .editor input[type="range"] { grid-column: 1 / -1; }
    .editor.table { display: block; }
    .editor.table textarea { margin-top: 6px; }
    .table-default { margin: 0 0 7px; color: #7a8795; font-size: 11px; }
    .unit { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 9px; background: #fff; }
    .card > label:first-child { margin-top: 0; }
    .field { display: grid; grid-template-columns: minmax(120px, .8fr) minmax(0, 1.2fr); gap: 7px; }
    .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(60px, .55fr); gap: 6px; }
    .options { max-height: 150px; overflow: auto; padding: 5px; border: 1px solid var(--line); border-radius: 6px; background: #fafbfd; }
    .option { display: flex; align-items: center; gap: 7px; margin: 0; padding: 3px; color: var(--ink); font-size: 12px; }
    .option span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; min-height: 390px; display: grid; grid-template-rows: auto 1fr; }
    .panel-head { padding: 10px; border-bottom: 1px solid var(--line); }
    .panel-top { display: flex; align-items: center; gap: 8px; }
    .panel-title { flex: 1; font-weight: 650; }
    .panel-settings { margin-top: 10px; padding: 10px; border: 1px solid #c9d4dd; border-radius: 7px; }
    .panel-settings label { margin-top: 0; font-weight: 650; color: #43515f; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
    .grid-2:first-child { margin-top: 0; }
    .y-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 8px; max-height: 150px; overflow: auto; padding: 7px; border: 1px solid var(--line); border-radius: 6px; background: #fafbfd; }
    .range { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .panel-body { padding: 10px; overflow: auto; }
    .panel-body.empty { display: flex; align-items: center; justify-content: center; min-height: 300px; color: #a9b4bf; text-align: center; }
    .panel-body.empty svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .panel-body svg { max-width: 100%; height: auto; }
    .empty-panels { min-height: 150px; border: 1px dashed #cad3dc; border-radius: 8px; }
    .results { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
    .table-wrap { min-height: 180px; max-height: min(34vh, 420px); overflow: auto; border: 1px solid var(--line); background: #fff; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th, td { padding: 5px 7px; border-bottom: 1px solid var(--line); border-right: 1px solid #edf1f5; text-align: right; white-space: nowrap; font-size: 12px; }
    th { position: sticky; top: 0; background: #eef3f7; color: #344456; }
    th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: #fff; }
    th:first-child { background: #eef3f7; z-index: 1; }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; height: auto; }
      aside { max-height: 46vh; border-right: 0; border-bottom: 1px solid var(--line); }
      .panels { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Cropbox Dashboard</h1>
    <div class="run-tools">
      <span class="status" id="status" aria-live="polite"></span>
      <button type="button" id="run-button" class="icon-button run" title="Run simulation" aria-label="Run simulation" onclick="runWorkflow()"></button>
    </div>
  </header>
  <main>
    <aside>
      <div class="heading"><h2>Model</h2></div>
      <div id="controls"></div>
      <div class="heading spaced"><h2>Simulation</h2></div>
      <div class="card">
        <label for="stop-mode">Stop</label>
        <div class="field">
          <select id="stop-mode" onchange="updateSimulationEditors()">
            <option value="value">Count / duration</option>
            <option value="condition">Model condition</option>
          </select>
          <div class="pair" id="stop-value-fields">
            <input id="stop-value" inputmode="decimal" value="5" aria-label="Stop count or duration">
            <input id="stop-unit" class="code" value="hr" list="unit-options" placeholder="unit" aria-label="Stop unit">
          </div>
          <input id="stop-condition" class="code" list="condition-options" placeholder="system.variable" aria-label="Stop condition" hidden>
        </div>
        <label for="snap-mode">Snapshots</label>
        <div class="field">
          <select id="snap-mode" onchange="updateSimulationEditors()">
            <option value="default">Service default</option>
            <option value="interval">Interval</option>
            <option value="condition">Model condition</option>
          </select>
          <div class="pair" id="snap-value-fields" hidden>
            <input id="snap-value" inputmode="decimal" value="1" aria-label="Snapshot interval">
            <input id="snap-unit" class="code" value="d" list="unit-options" placeholder="unit" aria-label="Snapshot unit">
          </div>
          <input id="snap-condition" class="code" list="condition-options" placeholder="system.variable" aria-label="Snapshot condition" hidden>
        </div>
        <label>Output columns</label>
        <div id="output-select" class="options" role="group" aria-label="Output columns"></div>
        <datalist id="condition-options"></datalist>
        <datalist id="unit-options"><option value="s"><option value="min"><option value="hr"><option value="d"></datalist>
      </div>
    </aside>
    <section>
      <div class="heading">
        <h2>Panels</h2>
        <button type="button" class="icon-button" title="Add panel" aria-label="Add panel" onclick="addPanel()"></button>
      </div>
      <div class="panels" id="panels"></div>
      <div class="results">
        <div class="heading">
          <h2>Results</h2>
          <button type="button" id="download-results" class="icon-button" title="Download results as CSV" aria-label="Download results as CSV" onclick="downloadCSV()" disabled></button>
        </div>
        <div class="table-wrap"><table id="result"></table></div>
      </div>
    </section>
  </main>
  <script>
    // State: the dashboard payload from GET /api/dashboard, the plot panels, uploaded CSV files
    // keyed by configuration path, and the table returned by the last POST /api/simulate.
    let schema = null;
    let panels = [];
    let running = false;
    const csvFiles = {};
    let result = { columns: [], rows: [] };

    const KINDS = ["line", "scatter", "scatterline", "step"];
    const TEMPORAL = ["Date", "DateTime", "ZonedDateTime"];
    const ICONS = {
      settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
      close: '<path d="M18 6 6 18M6 6l12 12"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
      play: '<path d="m7 4 13 8-13 8z"/>',
      moon: '<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/>',
    };
    const GLYPHS = { provide: "▦", table: "▦", preserve: "⚙", parameter: "⚙", accumulate: "∑", track: "ƒ", drive: "↦" };

    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const code = v => `<span class="code">${esc(v)}</span>`;
    const icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
    const spinner = `<span class="spinner" aria-label="Working"></span>`;
    const selectOptions = (values, selected) => values.map(v => `<option value="${esc(v)}" ${v === selected ? "selected" : ""}>${esc(v)}</option>`).join("");
    const outputs = () => schema.outputs || [];
    const outputPath = o => o.target || o.name;
    const outputMeta = path => outputs().find(o => o.target === path || o.name === path || o.alias === path);
    const outputLabel = path => { const unit = outputMeta(path)?.unit; return unit ? `${path} (${unit})` : path; };
    const plotKind = kind => KINDS.includes(kind) ? kind : kind === "point" ? "scatter" : "line";

    async function loadDashboard() {
      schema = await (await fetch("/api/dashboard")).json();
      $("title").textContent = schema.title || `${schema.model.name} Dashboard`;
      panels = (schema.panels || []).map(p => ({ ...defaultPanel(), ...p, y: p.y || [], kind: plotKind(p.kind), open: false }));
      if (!panels.length) panels.push(defaultPanel());
      renderStaticIcons();
      initSimulation();
      renderControls();
      renderOutputs();
      renderPanels();
    }

    function renderStaticIcons() {
      $("run-button").innerHTML = icon("play");
      $("download-results").innerHTML = icon("download");
      document.querySelector('[aria-label="Add panel"]').innerHTML = icon("plus");
    }

    // --- simulation settings (stop, snap, output columns) ---------------------

    const valueParts = spec => spec && typeof spec === "object" ? { value: spec.value ?? "", unit: spec.unit ?? "", type: spec.type } : { value: spec ?? "", unit: "", type: null };
    const isCondition = p => p.type === "Symbol" || (!p.unit && String(p.value).trim() !== "" && !Number.isFinite(Number(p.value)));

    function initSimulation() {
      const stop = valueParts(schema.simulation?.stop ?? { value: 5, unit: "hr" });
      const stopMode = isCondition(stop) ? "condition" : "value";
      $("stop-mode").value = stopMode;
      if (stopMode === "value") { $("stop-value").value = stop.value; $("stop-unit").value = stop.unit; }
      else $("stop-condition").value = stop.value;
      const snapSpec = schema.simulation?.snap;
      const snap = valueParts(snapSpec);
      const snapMode = snapSpec == null ? "default" : isCondition(snap) ? "condition" : "interval";
      $("snap-mode").value = snapMode;
      if (snapMode === "interval") { $("snap-value").value = snap.value; $("snap-unit").value = snap.unit; }
      if (snapMode === "condition") $("snap-condition").value = snap.value;
      const conditions = outputs().filter(o => o.state === "flag" || String(o.type || "").includes("Bool")).map(outputPath);
      $("condition-options").innerHTML = conditions.map(v => `<option value="${esc(v)}">`).join("");
      updateSimulationEditors();
    }

    function updateSimulationEditors() {
      const stopMode = $("stop-mode").value;
      $("stop-value-fields").hidden = stopMode !== "value";
      $("stop-condition").hidden = stopMode !== "condition";
      const snapMode = $("snap-mode").value;
      $("snap-value-fields").hidden = snapMode !== "interval";
      $("snap-condition").hidden = snapMode !== "condition";
    }

    function numberWithUnit(valueId, unitId, label, requireUnit = false) {
      const text = $(valueId).value.trim();
      const unit = $(unitId).value.trim();
      const value = Number(text);
      if (!text || !Number.isFinite(value)) throw new Error(`${label} must be a finite number.`);
      if (requireUnit && !unit) throw new Error(`${label} requires a unit.`);
      return unit ? { value, unit } : value;
    }

    function conditionValue(inputId, label) {
      const value = $(inputId).value.trim();
      if (!value) throw new Error(`${label} requires a model variable path.`);
      return value;
    }

    function simulationFields() {
      const fields = {};
      fields.stop = $("stop-mode").value === "condition" ? conditionValue("stop-condition", "Stop condition") : numberWithUnit("stop-value", "stop-unit", "Stop");
      const snapMode = $("snap-mode").value;
      if (snapMode === "interval") fields.snap = numberWithUnit("snap-value", "snap-unit", "Snapshot interval", true);
      if (snapMode === "condition") fields.snap = conditionValue("snap-condition", "Snapshot condition");
      return fields;
    }

    function renderOutputs() {
      const vars = outputs().map(outputPath).filter(v => v !== "time");
      $("output-select").innerHTML = vars.map((v, i) => `<label class="option"><input type="checkbox" value="${esc(v)}" ${i < 4 ? "checked" : ""}><span class="code">${esc(outputLabel(v))}</span></label>`).join("");
      $("output-select").querySelectorAll("input").forEach(el => el.addEventListener("change", () => result.columns.length && renderResultTable()));
    }

    const selectedColumns = () => [...document.querySelectorAll("#output-select input:checked")].map(el => el.value);

    // --- model tree: parameters, tables and variables grouped by system -------

    function renderControls() {
      const groups = {};
      const group = system => groups[system] ||= { parameters: [], tables: [], variables: [] };
      const rank = system => system === schema.model.name ? 0 : system === "Clock" ? 2 : 1;
      const controls = [...(schema.controls || [])].sort((a, b) => rank(a.system) - rank(b.system) || a.path.localeCompare(b.path));
      for (const c of controls) group(c.system)[c.role === "table" ? "tables" : "parameters"].push(c);
      for (const o of outputs()) group(o.system).variables.push(o);
      const section = (title, rows) => rows.length ? `<div class="tree-section">${title}</div>${rows.join("")}` : "";
      $("controls").innerHTML = Object.entries(groups).map(([system, g], i) => `
        <details class="group" ${i === 0 && g.parameters.length + g.tables.length + g.variables.length <= 24 ? "open" : ""}>
          <summary>${code(system)}</summary>
          <div class="group-body">
            ${section("Parameters", g.parameters.map(parameterRow))}
            ${section("Tables", g.tables.map(tableRow))}
            ${section("Variables", g.variables.map(variableRow))}
          </div>
        </details>`).join("");
      const root = $("controls");
      root.querySelectorAll("[data-enable]").forEach(el => el.addEventListener("change", toggleOverride));
      root.querySelectorAll("[data-value]").forEach(el => el.addEventListener("input", syncSlider));
      root.querySelectorAll("[data-range]").forEach(el => el.addEventListener("input", syncValue));
      root.querySelectorAll("input[type='file']").forEach(el => el.addEventListener("change", readCsvFile));
    }

    const compact = v => Array.isArray(v) ? `[${v.length} values]` : v && typeof v === "object" ? JSON.stringify(v) : String(v ?? "");

    function metadataText(item) {
      const rows = [
        ["State", item.state || item.role], ["Alias", item.alias], ["Default", compact(item.default)], ["Unit", item.unit],
        ["Type", item.value_type || item.type], ["Path", item.path || item.target], ["Depends on", (item.dependencies || []).join(", ")],
      ].filter(([, v]) => v).map(([k, v]) => `${k}: ${v}`);
      return [item.description, ...rows].filter(Boolean).join("\n");
    }

    function stateIcon(item) {
      const key = String(item.state || item.role || "").toLowerCase();
      const glyph = Object.entries(GLYPHS).find(([k]) => key.includes(k))?.[1] || "•";
      return `<span class="state-icon" title="${esc(metadataText(item))}">${glyph}</span>`;
    }

    function inputType(control) {
      const type = String(control.value_type || "").toLowerCase();
      if (type.includes("zoneddatetime")) return "text";
      if (type.includes("datetime")) return "datetime-local";
      if (type === "date") return "date";
      if (/matrix|vector|array/.test(type)) return "json";
      return control.kind === "checkbox" || control.kind === "number" ? control.kind : "text";
    }

    function parameterRow(c) {
      const type = inputType(c);
      const value = c.default ?? "";
      const step = c.step ?? "any";
      const range = type === "number" && c.min != null && c.max != null;
      return `<div class="tree-row inactive" data-row data-kind="parameter" data-path="${esc(c.path)}">
        <div class="tree-head" onclick="toggleRow(event)">
          <input type="checkbox" data-enable aria-label="Override ${esc(c.path)}">
          ${stateIcon(c)}
          <span class="tree-name">${code(c.label || c.name)}${value === "" ? "" : `<span class="tree-default code">= ${esc(compact(value))}</span>`}</span>
          <span class="tree-unit code">${esc(c.unit || "")}</span>
        </div>
        <div class="editor" hidden>
          <input data-value data-kind="${type}" data-unit="${esc(c.unit || "")}" type="${type === "checkbox" ? "checkbox" : type === "json" ? "text" : type}" step="${esc(step)}"
            value="${esc(type === "json" ? JSON.stringify(value) : value)}" ${type === "checkbox" && value === true ? "checked" : ""} disabled>
          <span class="unit code">${esc(c.unit || "")}</span>
          ${range ? `<input data-range type="range" min="${esc(c.min)}" max="${esc(c.max)}" step="${esc(step)}" value="${esc(value)}" disabled>` : ""}
        </div>
      </div>`;
    }

    function tableRow(c) {
      return `<div class="tree-row inactive" data-row data-kind="table" data-path="${esc(c.path)}">
        <div class="tree-head" onclick="toggleRow(event)">
          <input type="checkbox" data-enable aria-label="Provide ${esc(c.path)}">
          ${stateIcon(c)}
          <span class="tree-name">${code(c.label || c.name)}</span>
          <span class="tree-unit">CSV</span>
        </div>
        <div class="editor table" hidden>
          ${c.default_filename ? `<div class="table-default">Configured CSV: ${code(c.default_filename)}</div>` : ""}
          <input type="file" accept="${esc(c.accept || ".csv,text/csv")}" aria-label="CSV file for ${esc(c.path)}" disabled>
          <textarea data-text placeholder="CSV content can also be pasted here" aria-label="CSV text for ${esc(c.path)}" disabled></textarea>
        </div>
      </div>`;
    }

    const variableRow = o => `<div class="tree-row"><div class="tree-head"><span></span>${stateIcon(o)}<span class="tree-name">${code(o.name)}</span><span class="tree-unit code">${esc(o.unit || "")}</span></div></div>`;

    function toggleRow(event) {
      if (event.target.closest("input, select, textarea, button, .state-icon")) return;
      const box = event.currentTarget.querySelector("[data-enable]");
      box.checked = !box.checked;
      box.dispatchEvent(new Event("change"));
    }

    function toggleOverride(event) {
      const row = event.target.closest("[data-row]");
      const on = event.target.checked;
      row.classList.toggle("active", on);
      row.classList.toggle("inactive", !on);
      row.querySelector(".editor").hidden = !on;
      row.querySelectorAll(".editor input, .editor textarea").forEach(el => el.disabled = !on);
    }

    function syncSlider(event) {
      const range = event.target.closest("[data-row]").querySelector("[data-range]");
      if (range && event.target.value !== "") range.value = event.target.value;
    }

    function syncValue(event) {
      event.target.closest("[data-row]").querySelector("[data-value]").value = event.target.value;
    }

    async function readCsvFile(event) {
      const file = event.target.files?.[0];
      if (file) csvFiles[event.target.closest("[data-row]").dataset.path] = { filename: file.name, content: await file.text() };
    }

    // --- CSV column metadata for provided tables ------------------------------

    function parseCsvRow(line) {
      const values = [];
      let value = "", quoted = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          if (quoted && line[i + 1] === '"') { value += '"'; i++; } else quoted = !quoted;
        } else if (c === "," && !quoted) { values.push(value); value = ""; }
        else value += c;
      }
      values.push(value);
      return values;
    }

    function inferCsvType(text) {
      const s = String(text ?? "").trim();
      if (/^-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?$/.test(s)) return "Float64";
      if (/^\d{4}-\d{2}-\d{2}T.*(?:Z|[+-]\d{2}:?\d{2})$/.test(s)) return "ZonedDateTime";
      if (/^\d{4}-\d{2}-\d{2}T/.test(s)) return "DateTime";
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return "Date";
      if (/^(?:true|false)$/i.test(s)) return "Bool";
      return "String";
    }

    // Column metadata for a pasted/uploaded CSV: declared `columns` of the table control (from the
    // service `ui`) win, then the `drive` bindings of the model, then types inferred from the first row.
    function tableColumnMetadata(path, content) {
      const table = (schema.tables || []).find(t => t.path === path || t.declared === path);
      const control = (schema.controls || []).find(c => c.role === "table" && (c.path === path || c.declared === path));
      const lines = String(content || "").split(/\r?\n/).filter(line => line.trim());
      if (!lines.length) return [];
      const header = parseCsvRow(lines[0]);
      const sample = lines.length > 1 ? parseCsvRow(lines[1]) : [];
      const stopUnit = $("stop-unit").value.trim() || null;
      return header.map((raw, i) => {
        const name = raw.trim();
        const declared = (control?.columns || []).find(c => String(c.name ?? c.column) === name);
        const binding = (table?.columns || []).find(c => String(c.column) === name);
        const type = declared?.type || inferCsvType(sample[i]);
        const isIndex = table && String(table.index || "index") === name && !TEMPORAL.includes(type);
        const column = { name, type, unit: declared?.unit ?? binding?.unit ?? (isIndex ? stopUnit : null) };
        if (declared?.timezone) column.timezone = declared.timezone;
        return column;
      });
    }

    // --- requests ---------------------------------------------------------------

    function requestFromControls(extra = {}) {
      const config = {};
      document.querySelectorAll("[data-enable]:checked").forEach(box => {
        const row = box.closest("[data-row]");
        const path = row.dataset.path;
        if (row.dataset.kind === "table") {
          const content = row.querySelector("[data-text]").value.trim() || csvFiles[path]?.content;
          if (content) config[path] = { type: "CSV", content, columns: tableColumnMetadata(path, content) };
          return;
        }
        const input = row.querySelector("[data-value]");
        const kind = input.dataset.kind;
        if (kind === "checkbox") { config[path] = input.checked; return; }
        const raw = input.value.trim();
        if (raw === "") return;
        let value = raw;
        if (kind === "number") {
          value = Number(raw);
          if (!Number.isFinite(value)) throw new Error(`${path} must be a finite number.`);
        } else if (kind === "json") {
          try { value = JSON.parse(raw); } catch { throw new Error(`${path} requires valid JSON.`); }
        }
        config[path] = input.dataset.unit ? { value, unit: input.dataset.unit } : value;
      });
      return { config, ...simulationFields(), ...extra };
    }

    async function postJSON(path, payload) {
      const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error?.message || `${path} returned HTTP ${response.status}.`);
      return body;
    }

    // One simulation per run: the table covers the selected output columns plus every variable the
    // panels plot, so panels are drawn from it without simulating again (sweeps are the exception).
    async function runWorkflow() {
      if (running) return;
      running = true;
      const button = $("run-button");
      button.disabled = true;
      button.innerHTML = spinner;
      setStatus("");
      try {
        syncPanels();
        document.querySelectorAll(".panel-body").forEach(body => { body.classList.remove("empty"); body.innerHTML = spinner; });
        const target = [...new Set([...selectedColumns(), ...panels.flatMap(p => [p.x, ...p.y])])].filter(v => v !== "time");
        const res = await postJSON("/api/simulate", requestFromControls({ target }));
        result = { columns: res.columns, rows: res.rows };
        renderResultTable();
        await renderAllPanels();
      } catch (error) {
        showError(error.message || String(error));
      } finally {
        running = false;
        button.disabled = false;
        button.innerHTML = icon("play");
      }
    }

    // --- panels -----------------------------------------------------------------

    function defaultPanel() {
      const vars = outputs().map(outputPath).filter(v => v !== "time");
      const d = schema.visualize?.y?.default;
      const y = (Array.isArray(d) ? d : [d]).filter(Boolean);
      return { x: schema.visualize?.x?.default || "time", y: y.length ? y : vars.slice(0, 1), kind: "line", xstep: "", xmin: "", xmax: "", ymin: "", ymax: "", open: true };
    }

    function renderPanels() {
      const vars = outputs().map(outputPath);
      $("panels").innerHTML = panels.length ? panels.map((p, i) => `
        <div class="panel" data-panel="${i}">
          <div class="panel-head">
            <div class="panel-top">
              <span class="panel-title">${esc(p.title || `Panel ${i + 1}`)}</span>
              <button type="button" class="icon-button" title="Panel settings" aria-label="Panel settings" aria-expanded="${p.open}" onclick="togglePanelSettings(${i})">${icon("settings")}</button>
              <button type="button" class="icon-button danger" title="Remove panel" aria-label="Remove panel" onclick="removePanel(${i})">${icon("close")}</button>
            </div>
            <div class="panel-settings" ${p.open ? "" : "hidden"}>
              <div class="grid-2">
                <label>X axis<select data-x>${selectOptions(vars, p.x)}</select></label>
                <label>Plot kind<select data-kind>${selectOptions(KINDS, p.kind)}</select></label>
              </div>
              <label>Y axis</label>
              <div class="y-options">${vars.filter(v => v !== "time").map(v => `<label class="option"><input type="checkbox" data-y value="${esc(v)}" ${p.y.includes(v) ? "checked" : ""}><span class="code">${esc(outputLabel(v))}</span></label>`).join("")}</div>
              <div class="grid-2">
                <label>X limits<div class="range"><input type="number" step="any" data-xmin value="${esc(p.xmin)}" placeholder="min"><input type="number" step="any" data-xmax value="${esc(p.xmax)}" placeholder="max"></div></label>
                <label>Y limits<div class="range"><input type="number" step="any" data-ymin value="${esc(p.ymin)}" placeholder="min"><input type="number" step="any" data-ymax value="${esc(p.ymax)}" placeholder="max"></div></label>
              </div>
            </div>
          </div>
          <div class="panel-body empty" id="panel-body-${i}">${icon("moon")}</div>
        </div>`).join("") : `<div class="empty-panels" aria-label="No panels"></div>`;
      $("panels").querySelectorAll("select, input").forEach(el => el.addEventListener("change", syncPanels));
    }

    function syncPanels() {
      document.querySelectorAll("[data-panel]").forEach(el => {
        const p = panels[Number(el.dataset.panel)];
        p.x = el.querySelector("[data-x]").value;
        p.kind = el.querySelector("[data-kind]").value;
        p.y = [...el.querySelectorAll("[data-y]:checked")].map(input => input.value);
        for (const k of ["xmin", "xmax", "ymin", "ymax"]) p[k] = el.querySelector(`[data-${k}]`).value;
        p.open = !el.querySelector(".panel-settings").hidden;
      });
    }

    function addPanel() {
      syncPanels();
      panels.push(defaultPanel());
      renderPanels();
      if (result.rows.length) renderAllPanels();
    }

    function removePanel(index) {
      syncPanels();
      panels.splice(index, 1);
      renderPanels();
      if (result.rows.length) renderAllPanels();
    }

    function togglePanelSettings(index) {
      const panel = document.querySelector(`[data-panel="${index}"]`);
      const settings = panel.querySelector(".panel-settings");
      settings.hidden = !settings.hidden;
      panels[index].open = !settings.hidden;
      panel.querySelector('[aria-label="Panel settings"]').setAttribute("aria-expanded", String(!settings.hidden));
    }

    function limits(p) {
      const bound = (text, label) => {
        if (text === "" || text == null) return null;
        const n = Number(text);
        if (!Number.isFinite(n)) throw new Error(`${label} limits must be finite numbers.`);
        return n;
      };
      const plot = {};
      const xlim = [bound(p.xmin, "X"), bound(p.xmax, "X")];
      const ylim = [bound(p.ymin, "Y"), bound(p.ymax, "Y")];
      if (xlim.some(v => v !== null)) plot.xlim = xlim;
      if (ylim.some(v => v !== null)) plot.ylim = ylim;
      return plot;
    }

    // A panel whose `xstep` names a service-defined sweep re-simulates over that parameter.
    function sweepFor(path) {
      const s = path && (schema.sweeps || []).find(s => (s.path || `${s.system}.${s.name}`) === path);
      return s ? Object.fromEntries(Object.entries({ path, values: s.values, start: s.start, stop: s.stop, step: s.step, unit: s.unit }).filter(([, v]) => v != null)) : null;
    }

    async function renderPanel(index) {
      const p = panels[index];
      const body = $(`panel-body-${index}`);
      if (!p || !body) return;
      body.classList.remove("empty");
      const placeholder = message => { body.classList.add("empty"); body.innerHTML = esc(message); };
      if (!p.y.length) return placeholder("Select Y axis variables");
      if (new Set(p.y.map(v => outputMeta(v)?.unit || "")).size > 1) return placeholder("Selected variables use different units; put them in separate panels");
      body.innerHTML = spinner;
      try {
        const plot = limits(p);
        const sweep = sweepFor(p.xstep);
        let request;
        if (sweep) {
          request = requestFromControls({ x: p.x, y: p.y, kind: p.kind, xstep: sweep, plot });
          for (const c of schema.controls || []) if ([c.path, c.declared].includes(sweep.path)) delete request.config[c.path];
          delete request.config[sweep.path];
        } else {
          const indices = [...new Set([p.x, ...p.y])].map(v => result.columns.findIndex(c => c.name === v));
          if (indices.includes(-1)) return placeholder("Run the simulation to plot these variables");
          const data = { type: "DataFrame", columns: indices.map(i => result.columns[i]), rows: result.rows.map(row => indices.map(i => row[i])) };
          request = { data, x: p.x, y: p.y, kind: p.kind, plot };
        }
        const res = await postJSON("/api/visualize", request);
        body.innerHTML = res.body;
      } catch (error) {
        body.innerHTML = `<div class="error">${esc(error.message || error)}</div>`;
      }
    }

    async function renderAllPanels() {
      for (let i = 0; i < panels.length; i++) await renderPanel(i);
    }

    // --- results ----------------------------------------------------------------

    function visibleTable() {
      const keep = new Set(["time", ...selectedColumns()]);
      const indices = result.columns.map((c, i) => keep.has(c.name) ? i : -1).filter(i => i >= 0);
      return { columns: indices.map(i => result.columns[i]), rows: result.rows.map(row => indices.map(i => row[i])) };
    }

    function formatNumber(value) {
      if (typeof value !== "number" || !Number.isFinite(value)) return String(value ?? "");
      if (Number.isInteger(value)) return String(value);
      const magnitude = Math.abs(value);
      return magnitude >= 1e7 || magnitude < 1e-5 ? value.toExponential(6).replace(/\.?0+e/, "e") : String(Number(value.toPrecision(8)));
    }

    function renderResultTable() {
      const { columns, rows } = visibleTable();
      $("result").innerHTML = `<tr>${columns.map(c => `<th title="${esc(c.type || "")}">${code(c.name)}${c.unit ? ` (${code(c.unit)})` : ""}</th>`).join("")}</tr>`
        + rows.map(row => `<tr>${row.map(v => `<td>${esc(formatNumber(v))}</td>`).join("")}</tr>`).join("");
      $("download-results").disabled = !rows.length;
    }

    const csvCell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replaceAll('"', '""')}"` : s; };

    function downloadCSV() {
      const { columns, rows } = visibleTable();
      if (!rows.length) return;
      const csv = [columns.map(c => csvCell(c.unit ? `${c.name} (${c.unit})` : c.name)).join(","), ...rows.map(row => row.map(csvCell).join(","))].join("\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv + "\n"], { type: "text/csv;charset=utf-8" }));
      a.download = `${schema.model.name}_simulation.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function showError(message) {
      $("result").innerHTML = `<tr><td class="error">${esc(message)}</td></tr>`;
      $("download-results").disabled = true;
      document.querySelectorAll(".panel-body").forEach(body => { body.classList.remove("empty"); body.innerHTML = `<div class="error">${esc(message)}</div>`; });
      setStatus(message);
    }

    const setStatus = message => { $("status").textContent = message; };

    loadDashboard().catch(error => setStatus(error.message));
  </script>
</body>
</html>
