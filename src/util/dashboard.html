      const button = document.getElementById("run-button");
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
      button.title = "Running simulation";
      button.innerHTML = `<span class="run-button-spinner" aria-hidden="true"></span>`;
      setStatus("");
      try {
        syncPanels();
        document.querySelectorAll(".panel-body").forEach(body => {
          body.classList.remove("panel-empty");
          body.innerHTML = `<span class="panel-loading" aria-label="Running simulation"></span>`;
        });
        await runSimulation();
      } catch (error) {
        showTableError(error.message || error);
      } finally {
        isRunning = false;
        button.disabled = false;
        button.removeAttribute("aria-busy");
        button.title = "Run simulation";
        button.innerHTML = lucideIcon("play");
      }
    }

    function selectedTargetNames() {
      return Array.from(document.querySelectorAll("#target-select input:checked")).map(input => input.value);
    }

    function displayColumns(columns, rows) {
      const targets = selectedTargetNames();
      if (!targets.length) return { columns, rows };
      const indices = columns
        .map((column, index) => ({ column, index }))
        .filter(({ column }) => column.name === "time" || targets.includes(column.name))
        .map(item => item.index);
      if (!indices.length) return { columns, rows };
      return {
        columns: indices.map(index => columns[index]),
        rows: rows.map(row => indices.map(index => row[index]))
      };
    }

    function refreshTargetColumns() {
      if (!tableState.rawColumns.length) return;
      const filtered = displayColumns(tableState.rawColumns, tableState.rawRows);
      tableState = { ...tableState, columns: filtered.columns, rows: filtered.rows };
      renderResultTable();
    }

    async function runSimulation() {
      const res = await postJSON("/api/simulate", requestFromControls());
      if (res.status === "error") throw new Error(res.error.message);
      const filtered = displayColumns(res.columns, res.rows);
      tableState = { columns: filtered.columns, rows: filtered.rows, rawColumns: res.columns, rawRows: res.rows };
      renderResultTable();
      document.getElementById("download-results").disabled = !tableState.rows.length;
      await renderAllPanels();
      setStatus("");
    }

    function formatTableValue(value) {
      if (typeof value !== "number" || !Number.isFinite(value)) return String(value ?? "");
      if (Object.is(value, -0)) return "0";
      if (Number.isInteger(value)) return String(value);
      const magnitude = Math.abs(value);
      if (magnitude !== 0 && (magnitude >= 1e7 || magnitude < 1e-5)) {
        return value.toExponential(6).replace(/\.0+e/, "e").replace(/(\.\d*?)0+e/, "$1e");
      }
      return String(Number(value.toPrecision(8)));
    }

    function axisBounds(minText, maxText, label) {
      const min = String(minText ?? "").trim();
      const max = String(maxText ?? "").trim();
      if (!min && !max) return null;
      const lower = min ? Number(min) : null;
      const upper = max ? Number(max) : null;
      if ((lower !== null && !Number.isFinite(lower)) || (upper !== null && !Number.isFinite(upper))) {
        throw new Error(`${label} limits must be finite numbers.`);
      }
      if (lower !== null && upper !== null && lower >= upper) {
        throw new Error(`${label} minimum must be smaller than its maximum.`);
      }
      return [lower, upper];
    }

    function renderResultTable() {
      const head = `<tr>${tableState.columns.map(c => `<th title="${esc(c.type || "")}">${code(c.name)}${c.unit ? " (" + code(c.unit) + ")" : ""}</th>`).join("")}</tr>`;
      const body = tableState.rows.map(row => `<tr>${row.map(v => `<td>${esc(formatTableValue(v))}</td>`).join("")}</tr>`).join("");
      document.getElementById("result").innerHTML = head + body;
    }

    function csvCell(value) {
      const s = String(value ?? "");
      return /[",\n]/.test(s) ? `"${s.replaceAll('"', '""')}"` : s;
    }

    function downloadTableCSV() {
      if (!tableState.columns.length || !tableState.rows.length) return;
      const csv = [
        tableState.columns.map(c => csvCell(c.unit ? `${c.name} (${c.unit})` : c.name)).join(","),
        ...tableState.rows.map(row => row.map(csvCell).join(","))
      ].join("\n");
      const blob = new Blob([csv + "\n"], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${schema.model.name}_simulation.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function renderPanel(index) {
      const panel = panels[index];
      const body = document.getElementById(`panel-body-${index}`);
      if (!panel || !body) return;
      const yUnits = [...new Set((panel.y || []).map(path => outputMetadata(path)?.unit || "").filter(Boolean))];
      if (yUnits.length > 1) {
        body.classList.remove("panel-empty");
        body.innerHTML = `<div class="error">Selected targets use different units (${esc(yUnits.join(", "))}). Put them in separate panels.</div>`;
        return;
      }
      body.classList.remove("panel-empty");
      body.innerHTML = `<span class="panel-loading" aria-label="Rendering visualization"></span>`;
      try {
        const bounds = {};
        const xlim = axisBounds(panel.xmin, panel.xmax, "X axis");
        const ylim = axisBounds(panel.ymin, panel.ymax, "Y axis");
        if (xlim) bounds.xlim = xlim;
        if (ylim) bounds.ylim = ylim;
        const xstep = sweepByPath(panel.xstep);
        const plotOptions = {
          ...bounds,
          ...(panel.linestyles?.length === panel.y?.length ? { linestyles: panel.linestyles } : {})
        };
        const plot = Object.keys(plotOptions).length ? plotOptions : undefined;
        const request = requestFromControls({ x: panel.x || "time", y: panel.y, kind: normalizedPlotKind(panel.kind), xstep, ...(plot ? { plot } : {}) });
        if (xstep?.path) {
          const sweptPaths = new Set(
            (schema.controls || [])
              .filter(control => (control.accepted_config_paths || [control.path]).includes(xstep.path))
              .map(control => control.path)
          );
          sweptPaths.add(xstep.path);
          request.config_entries = (request.config_entries || []).filter(entry => !sweptPaths.has(entry.path));
        }
        const res = await postJSON("/api/visualize", request);
        body.innerHTML = res.status === "ok" ? res.body : `<div class="error">${esc(res.error?.message || "Visualization failed.")}</div>`;
      } catch (error) {
        body.innerHTML = `<div class="error">${esc(error.message || error)}</div>`;
      }
    }

    async function renderAllPanels() {
      for (let i = 0; i < panels.length; i++) await renderPanel(i);
    }

    async function postJSON(path, payload) {
      const response = await fetch(path, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error?.message || `${path} returned HTTP ${response.status}.`);
      return body;
    }

    function showTableError(message) {
      document.getElementById("result").innerHTML = `<tr><td class="error">${esc(message)}</td></tr>`;
      document.getElementById("download-results").disabled = true;
      document.querySelectorAll(".panel-body").forEach(body => {
        body.innerHTML = `<div class="error">${esc(message)}</div>`;
      });
      setStatus(message);
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    renderStaticIcons();
    initializeLayoutResizer();
    loadDashboard().catch(error => setStatus(error.message));
  </script>
</body>
</html>
