<!-- Adapted from the Cropbox course workflow diagram, 2026-03-10. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Cropbox modeling workflow</title>
  <desc id="desc">A model specification is converted into a simulation, whose output supports visualization and evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="320" y="70" fill="#667085" font-size="17" font-style="italic" text-anchor="end">Language</text>
    <rect x="350" y="20" width="260" height="100" rx="16" fill="#eef2ff" stroke="#4063d8" stroke-width="3"/>
    <text x="480" y="60" fill="#243b8f" font-size="24" font-weight="700">Specification</text>
    <text x="480" y="90" fill="#17212b" font-size="18">@system</text>
    <text x="480" y="108" fill="#475467" font-size="13">variables · equations · behaviors</text>

    <text x="515" y="153" fill="#667085" font-size="16" font-style="italic" text-anchor="start">Code generation</text>
    <path d="M 480 120 V 168" fill="none" stroke="#667085" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="320" y="230" fill="#667085" font-size="17" font-style="italic" text-anchor="end">Configuration</text>
    <rect x="350" y="180" width="260" height="100" rx="16" fill="#edf7eb" stroke="#389826" stroke-width="3"/>
    <text x="480" y="220" fill="#286d1b" font-size="24" font-weight="700">Simulation</text>
    <text x="480" y="250" fill="#17212b" font-size="18">@config · simulate</text>
    <text x="480" y="268" fill="#475467" font-size="13">scenarios · updates · output</text>

    <path d="M 480 280 V 310 H 310 V 328" fill="none" stroke="#667085" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <path d="M 480 310 H 650 V 328" fill="none" stroke="#667085" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

    <text x="250" y="302" fill="#667085" font-size="16" font-style="italic">Interaction</text>
    <rect x="180" y="340" width="260" height="100" rx="16" fill="#f6eff8" stroke="#9558b2" stroke-width="3"/>
    <text x="310" y="380" fill="#704087" font-size="24" font-weight="700">Visualization</text>
    <text x="310" y="410" fill="#17212b" font-size="18">visualize · plot</text>
    <text x="310" y="428" fill="#475467" font-size="13">trajectories · comparisons</text>

    <text x="710" y="302" fill="#667085" font-size="16" font-style="italic">Calibration</text>
    <rect x="520" y="340" width="260" height="100" rx="16" fill="#fff0f0" stroke="#cb3c33" stroke-width="3"/>
    <text x="650" y="380" fill="#9f2f28" font-size="24" font-weight="700">Evaluation</text>
    <text x="650" y="410" fill="#17212b" font-size="18">evaluate · calibrate</text>
    <text x="650" y="428" fill="#475467" font-size="13">metrics · fitting · validation</text>
  </g>
</svg>
