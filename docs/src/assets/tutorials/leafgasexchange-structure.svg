<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">LeafGasExchange model structure</title>
  <desc id="desc">Weather, nitrogen, and water status drive a coupled calculation of photosynthesis, stomatal conductance, and energy balance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#667085"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="25" y="35" width="220" height="76" rx="14" fill="#eef2ff" stroke="#4063d8" stroke-width="2.5"/>
    <text x="135" y="67" fill="#243b8f" font-size="20" font-weight="700">Weather</text>
    <text x="135" y="92" fill="#475467" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PFD · CO₂ · RH · T_air · wind</text>
    <rect x="25" y="145" width="220" height="76" rx="14" fill="#edf7eb" stroke="#389826" stroke-width="2.5"/>
    <text x="135" y="177" fill="#286d1b" font-size="20" font-weight="700">Leaf nitrogen</text>
    <text x="135" y="202" fill="#475467" font-size="14">SPAD or N</text>
    <rect x="25" y="255" width="220" height="76" rx="14" fill="#eaf7f8" stroke="#3b8792" stroke-width="2.5"/>
    <text x="135" y="287" fill="#286570" font-size="20" font-weight="700">Water status</text>
    <text x="135" y="312" fill="#475467" font-size="14">leaf water potential</text>

    <path d="M245 73H348" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M245 183H348" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M245 293H348" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="360" y="25" width="330" height="320" rx="22" fill="#fff" stroke="#98a2b3" stroke-width="2.5"/>
    <text x="525" y="58" fill="#344054" font-size="18" font-weight="700">Coupled leaf solution</text>
    <rect x="405" y="82" width="240" height="62" rx="13" fill="#fff7df" stroke="#d69e2e" stroke-width="2.5"/>
    <text x="525" y="108" fill="#8a5b08" font-size="19" font-weight="700">Photosynthesis</text>
    <text x="525" y="130" fill="#475467" font-size="14">biochemical limitation rates</text>
    <rect x="405" y="172" width="240" height="62" rx="13" fill="#f6eff8" stroke="#9558b2" stroke-width="2.5"/>
    <text x="525" y="198" fill="#704087" font-size="19" font-weight="700">Stomata</text>
    <text x="525" y="220" fill="#475467" font-size="14">conductance and CO₂ supply</text>
    <rect x="405" y="262" width="240" height="62" rx="13" fill="#fff0f0" stroke="#cb3c33" stroke-width="2.5"/>
    <text x="525" y="288" fill="#9f2f28" font-size="19" font-weight="700">Energy balance</text>
    <text x="525" y="310" fill="#475467" font-size="14">leaf temperature and vapor pressure</text>
    <path d="M480 144V170" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M570 234V260" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M645 293H666V113H647" fill="none" stroke="#667085" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

    <path d="M690 185H735" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="747" y="92" width="188" height="186" rx="16" fill="#f8fafc" stroke="#667085" stroke-width="2.5"/>
    <text x="841" y="127" fill="#344054" font-size="20" font-weight="700">Solved outputs</text>
    <text x="841" y="163" fill="#17212b" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">A_net · Ac · Aj · Ap</text>
    <text x="841" y="197" fill="#17212b" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Ci · gs</text>
    <text x="841" y="231" fill="#17212b" font-size="17">leaf temperature</text>
    <text x="841" y="253" fill="#667085" font-size="12">fields depend on the</text>
    <text x="841" y="270" fill="#667085" font-size="12">selected model variant</text>
  </g>
</svg>
