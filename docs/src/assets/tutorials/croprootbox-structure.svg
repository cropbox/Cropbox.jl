<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 370" role="img" aria-labelledby="title desc">
  <title id="title">CropRootBox system and geometric hierarchy</title>
  <desc id="desc">RootArchitecture produces primary root axes, which produce first- and second-order laterals; every axis is a chain of RootSegment systems constrained by a container.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#667085"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="26" y="112" width="190" height="112" rx="16" fill="#eef2ff" stroke="#4063d8" stroke-width="3"/>
    <text x="121" y="153" fill="#243b8f" font-size="21" font-weight="700">RootArchitecture</text>
    <text x="121" y="181" fill="#475467" font-size="14">basal root production</text>
    <text x="121" y="204" fill="#475467" font-size="14">transition matrix T</text>
    <path d="M216 168H270" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="282" y="40" width="205" height="82" rx="14" fill="#fff0f0" stroke="#cb3c33" stroke-width="2.5"/>
    <text x="385" y="76" fill="#9f2f28" font-size="19" font-weight="700">Primary root</text>
    <text x="385" y="101" fill="#475467" font-size="14">order 1 axis</text>
    <rect x="282" y="144" width="205" height="82" rx="14" fill="#edf7eb" stroke="#389826" stroke-width="2.5"/>
    <text x="385" y="180" fill="#286d1b" font-size="19" font-weight="700">First-order lateral</text>
    <text x="385" y="205" fill="#475467" font-size="14">order 2 axis</text>
    <rect x="282" y="248" width="205" height="82" rx="14" fill="#eaf7f8" stroke="#3b8792" stroke-width="2.5"/>
    <text x="385" y="284" fill="#286570" font-size="19" font-weight="700">Second-order lateral</text>
    <text x="385" y="309" fill="#475467" font-size="14">order 3 axis</text>
    <path d="M385 122V142" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M385 226V246" fill="none" stroke="#667085" stroke-width="2.5" marker-end="url(#arrow)"/>

    <path d="M487 185H548" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="560" y="94" width="250" height="182" rx="18" fill="#fff7df" stroke="#d69e2e" stroke-width="3"/>
    <text x="685" y="130" fill="#8a5b08" font-size="21" font-weight="700">Each root axis</text>
    <circle cx="606" cy="183" r="13" fill="#d1495b"/>
    <circle cx="658" cy="183" r="13" fill="#d1495b"/>
    <circle cx="710" cy="183" r="13" fill="#d1495b"/>
    <circle cx="762" cy="183" r="13" fill="#d1495b"/>
    <path d="M619 183H645M671 183H697M723 183H749" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="685" y="226" fill="#17212b" font-size="16">a chain of RootSegment systems</text>
    <text x="685" y="251" fill="#475467" font-size="14">elongation · tropism · branching</text>

    <path d="M810 185H852" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="864" y="105" width="130" height="160" rx="18" fill="#f6eff8" stroke="#9558b2" stroke-width="3"/>
    <text x="929" y="143" fill="#704087" font-size="20" font-weight="700">Container</text>
    <text x="929" y="176" fill="#17212b" font-size="15">Pot</text>
    <text x="929" y="201" fill="#17212b" font-size="15">Rhizobox</text>
    <text x="929" y="226" fill="#17212b" font-size="15">SoilCore</text>
    <text x="929" y="249" fill="#475467" font-size="12">boundary checks</text>
  </g>
</svg>
